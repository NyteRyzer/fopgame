name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create (e.g. v1.0)
        required: true
        default: v1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release with the patch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: The Fairly OddParents - Magic Words! ${{ inputs.tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: patches/fop-magic-words.bps
