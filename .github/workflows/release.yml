name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release with the patch
        uses: softprops/action-gh-release@v2
        with:
          name: The Fairly OddParents - Magic Words! ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: patches/fop-magic-words.bps
